---
- name: Installation sur les serveurs Rocky Linux
  hosts: serveurs
  become: true
  gather_facts: true

  serial: 1

  vars:
    fichier_local: "files/file.zip"
    fichier_distant: "/reception/file.zip"

    script_installation: "/monscript/script_install.sh"
    service_name: "leservice.service"

    seuil_critique: 95
    seuil_transfert: 80

    # Date du jour au format JJ/MM/AA
    date_installation: "{{ ansible_date_time.date | strftime('%d/%m/%y') }}"

    # Log au format :
    # hh-mm-ss-date-jj-mm-aa.txt
    log_file: >-
      /reception/{{ ansible_date_time.time | regex_replace(':', '-') }}-date-{{
      ansible_date_time.date | regex_replace(
        '^([0-9]{4})-([0-9]{2})-([0-9]{2})$',
        '\\3-\\2-\\1'
      )
      }}.txt

  pre_tasks:

    # ============================================================
    # VERIFICATION ROCKY LINUX
    # ============================================================

    - name: Vérifier que le système est Rocky Linux
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Rocky"
        fail_msg: >
          Ce playbook est prévu pour Rocky Linux.
          Système détecté : {{ ansible_distribution }}
        success_msg: "Rocky Linux détecté."

    # ============================================================
    # VERIFICATION /reception
    # ============================================================

    - name: Vérifier que /reception existe
      ansible.builtin.stat:
        path: /reception
      register: reception_dir

    - name: Arrêter si /reception n'existe pas
      ansible.builtin.fail:
        msg: >
          Le répertoire /reception n'existe pas sur
          {{ inventory_hostname }}.
      when:
        - not reception_dir.stat.exists
          or not reception_dir.stat.isdir

    # ============================================================
    # VERIFICATION ESPACE DISQUE
    # ============================================================

    - name: Vérifier l'espace disponible sur /reception
      ansible.builtin.command:
        cmd: df -P /reception
      register: reception_df
      changed_when: false

    - name: Vérifier l'espace disponible sur /var
      ansible.builtin.command:
        cmd: df -P /var
      register: var_df
      changed_when: false

    - name: Calculer le taux d'utilisation de /reception
      ansible.builtin.set_fact:
        reception_usage: >-
          {{
            reception_df.stdout_lines[1].split()[4]
            | regex_replace('%', '')
            | int
          }}

    - name: Calculer le taux d'utilisation de /var
      ansible.builtin.set_fact:
        var_usage: >-
          {{
            var_df.stdout_lines[1].split()[4]
            | regex_replace('%', '')
            | int
          }}

    - name: Afficher les informations
      ansible.builtin.debug:
        msg:
          - "Serveur : {{ inventory_hostname }}"
          - "Date d'installation : {{ date_installation }}"
          - "/reception utilisé à : {{ reception_usage }}%"
          - "/var utilisé à : {{ var_usage }}%"
          - "Log : {{ log_file }}"

    # ============================================================
    # SEUIL CRITIQUE 95 %
    # ============================================================

    - name: STOP - /reception dépasse 95 %
      ansible.builtin.fail:
        msg: >
          ATTENTION : il vous manque de la place pour accueillir
          le fichier file.zip.
          /reception est utilisé à {{ reception_usage }}%.
          Installation arrêtée sur {{ inventory_hostname }}.
      when: reception_usage > seuil_critique

    - name: STOP - /var dépasse 95 %
      ansible.builtin.fail:
        msg: >
          ATTENTION : il vous manque de la place pour accueillir
          le fichier file.zip.
          /var est utilisé à {{ var_usage }}%.
          Installation arrêtée sur {{ inventory_hostname }}.
      when: var_usage > seuil_critique

    # ============================================================
    # SEUIL DE SECURITE 80 %
    # ============================================================

    - name: STOP - /reception dépasse 80 %
      ansible.builtin.fail:
        msg: >
          Installation annulée.
          /reception est utilisé à {{ reception_usage }}%.
          Le seuil maximum autorisé est de {{ seuil_transfert }}%.
      when: reception_usage > seuil_transfert

    - name: STOP - /var dépasse 80 %
      ansible.builtin.fail:
        msg: >
          Installation annulée.
          /var est utilisé à {{ var_usage }}%.
          Le seuil maximum autorisé est de {{ seuil_transfert }}%.
      when: var_usage > seuil_transfert

    # ============================================================
    # VERIFICATION DU ZIP
    # ============================================================

    - name: Vérifier que file.zip existe sur la machine Ansible
      ansible.builtin.stat:
        path: "{{ fichier_local }}"
      delegate_to: localhost
      become: false
      register: fichier_local_stat

    - name: Arrêter si file.zip est absent
      ansible.builtin.fail:
        msg: >
          Le fichier {{ fichier_local }} est introuvable
          sur la machine Ansible.
      when: not fichier_local_stat.stat.exists

    # ============================================================
    # INSTALLATION DE UNZIP
    # ============================================================

    - name: Installer unzip
      ansible.builtin.dnf:
        name: unzip
        state: present

    # ============================================================
    # COPIE DU FICHIER
    # ============================================================

    - name: Copier file.zip vers /reception
      ansible.builtin.copy:
        src: "{{ fichier_local }}"
        dest: "{{ fichier_distant }}"
        owner: root
        group: root
        mode: "0644"

    # ============================================================
    # DECOMPRESSION
    # ============================================================

    - name: Décompresser file.zip
      ansible.builtin.unarchive:
        src: "{{ fichier_distant }}"
        dest: /reception
        remote_src: true
        owner: root
        group: root

    # ============================================================
    # VERIFICATION DU SCRIPT
    # ============================================================

    - name: Vérifier la présence de script_install.sh
      ansible.builtin.stat:
        path: "{{ script_installation }}"
      register: script_stat

    - name: Arrêter si script_install.sh est absent
      ansible.builtin.fail:
        msg: >
          Le script {{ script_installation }} est introuvable
          sur {{ inventory_hostname }}.
      when: not script_stat.stat.exists

    - name: Rendre script_install.sh exécutable
      ansible.builtin.file:
        path: "{{ script_installation }}"
        owner: root
        group: root
        mode: "0755"

    # ============================================================
    # ARRET DU SERVICE
    # ============================================================

    - name: Arrêter leservice.service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: stopped

    # ============================================================
    # EXECUTION DU SCRIPT
    # ============================================================

    - name: Lancer script_install.sh avec la date du jour
      ansible.builtin.shell: |
        set -o pipefail

        "{{ script_installation }}" "{{ date_installation }}" 2>&1 \
          | tee "{{ log_file }}"

        exit "${PIPESTATUS[0]}"
      args:
        executable: /bin/bash
      register: installation_result
      changed_when: true
      failed_when: false

    # ============================================================
    # ANALYSE DU LOG
    # ============================================================

    - name: Rechercher ERR ERROR ou ERREUR dans le log
      ansible.builtin.shell: |
        grep -Ein 'err|error|erreur' "{{ log_file }}" || true
      args:
        executable: /bin/bash
      register: erreurs_logs
      changed_when: false

    - name: Afficher les erreurs trouvées
      ansible.builtin.debug:
        msg:
          - "Des erreurs ont été trouvées dans le log."
          - "Fichier : {{ log_file }}"
          - "{{ erreurs_logs.stdout }}"
      when: erreurs_logs.stdout | length > 0

    # ============================================================
    # REDEMARRAGE DU SERVICE
    # ============================================================

    - name: Redémarrer leservice.service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: started
        enabled: true
        daemon_reload: true

    # ============================================================
    # RESULTAT
    # ============================================================

    - name: Installation réussie
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "Votre installation s'est effectuée avec succes"
          - "Serveur : {{ inventory_hostname }}"
          - "Date passée au script : {{ date_installation }}"
          - "Log : {{ log_file }}"
          - "======================================================"
      when:
        - installation_result.rc == 0
        - erreurs_logs.stdout | length == 0

    - name: Installation en erreur
      ansible.builtin.fail:
        msg:
          - "======================================================"
          - "ERREUR : l'installation a échoué"
          - "Serveur : {{ inventory_hostname }}"
          - "Code retour : {{ installation_result.rc }}"
          - "Date passée au script : {{ date_installation }}"
          - "Consultez le log : {{ log_file }}"
          - "======================================================"
      when:
        - installation_result.rc != 0
          or erreurs_logs.stdout | length > 0
